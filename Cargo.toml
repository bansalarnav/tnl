[workspace]
members = ["core", "tnlc", "tnld"]
resolver = "3"

[workspace.package]
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"

# Upstream re-notifies pending ACME challenges, which Boulder rejects with 409.
# Keep this patch until rustls-acme includes the fix.
[patch.crates-io]
rustls-acme = { path = "vendor/rustls-acme" }
