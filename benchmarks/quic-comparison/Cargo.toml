[package]
name = "quic-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
mio = { version = "1", features = ["net", "os-poll"] }
rand = "0.9"
s2n-quic = { version = "=1.88.0", features = ["provider-tls-s2n"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "time"] }
tokio-quiche = { version = "=0.19.1", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
