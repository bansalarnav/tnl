[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
rand = "0.8.5"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.3", default-features = false, features = ["ring", "tls12", "tokio", "webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1.18"
url = "2.5.8"
webpki-roots = "1.0.6"
