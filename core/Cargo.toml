[package]
name = "tnl-core"
version = "0.1.0"
edition = "2024"
description = "Embeddable client and server for end-to-end encrypted tunnels"

[lib]
name = "tnl"

[features]
default = []
client = [
    "dep:muxado",
    "dep:tokio",
]
server = [
    "dep:muxado",
    "dep:tokio",
]

[dependencies]
muxado = { version = "0.5.4", optional = true }
tokio = { version = "1.50.0", features = ["io-util", "macros", "rt", "sync"], optional = true }
