[package]
name = "tnl-relay"
version.workspace = true
edition = "2024"
description = "Embeddable public relay for tnl tunnels"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
http-body-util = "0.1.4"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "http2", "server", "service", "tokio"] }
rand = "0.8.5"
rustls = { version = "0.23.42", default-features = false, features = ["std"] }
tnl-core = { path = "../core" }
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tracing = "0.1.44"
