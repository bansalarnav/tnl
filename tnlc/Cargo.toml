[package]
name = "tnlc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
rand = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tnl = { package = "tnl-core", path = "../core", features = ["forwarding"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
