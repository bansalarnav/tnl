[package]
name = "tnld"
version.workspace = true
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
rand = "0.8.5"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "tokio", "webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tnl-relay = { path = "../relay" }
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = "0.1.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
