[package]
name = "tnld"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.8"
base64 = "0.22.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.183"
rand = "0.8.5"
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.3", default-features = false, features = ["ring", "tokio", "webpki-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tnl = { package = "tnl-core", path = "../core", features = ["server"] }
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.18"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
