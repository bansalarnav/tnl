[package]
name = "tunnel-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.8"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.183"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
